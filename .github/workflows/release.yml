name: Cut the Save release package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build, test, publish, and verify
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)(?:-[0-9A-Za-z.-]+)?$') {
              throw 'Release tags must use vMAJOR.MINOR.PATCH with an optional prerelease suffix.'
            }
            ./scripts/Publish-CutTheSave.ps1 -ReleaseVersion $Matches[1] -RunUpdaterAcceptance
          } else {
            ./scripts/Publish-CutTheSave.ps1 -RunUpdaterAcceptance
          }

      - name: Upload release package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CutTheSave-${{ github.ref_name }}-win-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/*-SHA256.txt
          if-no-files-found: error
